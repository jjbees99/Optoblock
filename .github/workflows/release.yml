name: Build Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build application
        run: python -m PyInstaller --noconfirm --clean Optoblock.spec

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path dist\Optoblock -DestinationPath Optoblock-Windows.zip -CompressionLevel Optimal

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Optoblock-Windows
          path: Optoblock-Windows.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          Optoblock-Windows.zip
          --repo "${{ github.repository }}"
          --title "Optoblock ${{ github.ref_name }}"
          --generate-notes
